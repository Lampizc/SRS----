# ==============================================================================
# srs_track 全局配置 —— 全项目参数唯一真源（single source of truth）
# ==============================================================================
# 规则（依据《同学A工作流程》§3.2，第 1 次组会宣布后生效）：
#   1. 改参数只改本文件。任何 .py 中不得出现 600 / 64 / 1.995e9 这类系统常数
#      （C_LIGHT、EARTH_RADIUS_M 等普适物理常数除外，它们集中在 contract.py）。
#   2. 加载链路：本文件 → srs_track/config.py 的 load_config() 做键名白名单、
#      类型与契约版本校验 → 构造 frozen SystemConfig / SRSConfig。
#      自检命令：python -m srs_track.config
#   3. system: 节的键名与 SystemConfig 字段逐字对应（contract.py 第 1 节）；
#      缺键 = 采用契约默认值（默认值不在此复制，避免两处维护）。加载器对
#      未知键名直接报错——拼错参数名不允许静默通过。
#   4. experiment: 节是实验矩阵（申报书扫描维度），不进 SystemConfig，由
#      实验脚本经 load_config() 读取；数值变更须在组会记录里写明。
#   5. 调试用小阵列（如 8×8）参数放独立的 config_debug.yaml，与本文件不竞争
#      真源地位；参考配置出任何问题以本文件 + 契约为准。
#
# ⚠ YAML 写法注意（PyYAML 1.1 解析器的坑）：
#   科学计数法必须带小数点且指数带符号，如 1.995e+9、5.0e-4；
#   写成 1.995e9 会被 PyYAML 解析成字符串，加载器会直接报错拦下。
# ==============================================================================

meta:
  schema_version: 1
  # 与 contract.CONTRACT_VERSION 核对；不匹配说明配置与契约脱节，拒绝加载。
  # 升契约版本时，先确认本文件是否受影响，再同步这里。
  contract_version_expected: "1.0.1"

# ------------------------------------------------------------------------------
# 系统物理与阵列参数 → SystemConfig（逐字对应 contract.py 第 1 节）
# ------------------------------------------------------------------------------
system:
  # --- 轨道与几何 ---
  orbit_height_km: 600.0        # 轨道高度 km
  min_elev_deg: 30.0            # 最低服务仰角 deg；决定服务区半径（≈853 km）
                                # 与最大离轴角（≈52.3°）

  # --- 阵列 ---
  n_u: 64                       # UPA 第一轴阵元数。契约当前假定方阵（n_u=n_v）
  n_v: 64                       # UPA 第二轴阵元数
  spacing_m: 0.0681             # 阵元间距 m ≈ λ_dl/2；d/λ_ul ≈ 0.4532 < 0.5
                                # 保证可见区无空间混叠（契约 __post_init__ 会拦）

  # --- 载波（FDD：上行 < 下行）---
  f_ul_hz: 1.995e+9             # 上行载波 Hz。SRS 是上行信号，坐标链/噪声/SNR
  f_dl_hz: 2.185e+9             # 下行载波 Hz。重建下行流形时用 d/λ_dl ≈ 0.4963

  # --- 时间 ---
  slot_duration_s: 5.0e-4       # 一个时隙 0.5 ms（5G NR，30 kHz 子载波间隔）。
                                # 全项目"时刻"一律用时隙索引，不用秒

# ------------------------------------------------------------------------------
# SRS 默认资源配置 → SRSConfig（单次测量可在代码里覆盖，默认值从这里出）
# ------------------------------------------------------------------------------
# TODO(同学A，M1 内)：按 3GPP TS 38.211 §6.4.1.4 / TS 38.214 把下列参数映射
# 成实际时频码资源，映射表落 docs/srs_mapping.md。注意 bandwidth_prb=96 是
# 仿真简化值，与 38.211 的 SRS 带宽表（m_SRS,b）的对应关系**待核对**，映射
# 任务完成前不要在报告里把它当标准值引用。
# ------------------------------------------------------------------------------
srs_default:
  n_symbols: 4                  # 单次测量占用 OFDM 符号数 L（扫描见 experiment）
  comb: 2                       # 梳状间隔，5G NR 仅允许 2 / 4
  bandwidth_prb: 96             # 带宽，PRB 数（见上 TODO）
  cyclic_shift: 0               # 循环移位索引（码域正交）
  n_ports: 1                    # 端口数
  hopping: false                # 是否跳频

# ------------------------------------------------------------------------------
# 实验矩阵（申报书扫描维度；不进 SystemConfig，实验脚本只读不改）
# ------------------------------------------------------------------------------
experiment:
  layouts: [uniform, hotspot, corridor]      # 三类布局
  user_types: [static, pedestrian, vehicle]  # 三类移动（速率范围见
                                             # contract.USER_SPEED_RANGE_MS）

  snr_db_list: [20, 30, 40]          # 阵列级、单符号、上行 SNR（口径见契约第 3 节）
  window_half_width_modes: [1, 2, 3] # 观测窗半宽（模式间隔）→ 3×3 / 5×5 / 7×7 波束
  group_sizes: [2, 4, 8]             # 复用组规模（申报书：2/4/8 用户共用一条 SRS）
  n_symbols_list: [1, 2, 4, 8]       # 符号数扫描（L 符号相干合并增益 10log10 L）
  n_users_list: [100, 1000, 10000]   # 规模扫描：数百 → ≥1 万（1 万须分层实现，
                                     # 禁止 O(K²) 全量两两检查——见分工方案风险表）
  n_seeds: 5                         # 独立随机种子数（考核要求 ≥5）
  base_seed: 2026                    # 种子派生起点：seeds = base_seed + 0..n_seeds-1；
                                     # 所有随机性只从 Scene.seed 派生（契约铁律 3）

  # --- 误差预算默认量级（合成实验用；正式值按用户/链路逐个算，结构见
  #     contract.ErrorBudget。申报书式(1)：测量限+固定偏差限+预测限 ≤ 容限 ε）---
  error_budget_defaults:
    tol_radius_rms: null             # 方向误差容限 ε（RMS 半径，方向余弦单位）。
                                     # TODO(M2 前)：申报书未给数值，与同学 D 定标后回填
    proc_delay_s: null               # 处理延迟 s。TODO(M2 前)：与 D 一起定占位值

  # --- 布局细参（uniform 由同学 A 出样板；hotspot/corridor 打样归同学 C/D，定稿回填）---
  layout_params:
    hotspot: {}                      # TODO：簇数/簇半径/簇内用户占比
    corridor: {}                     # TODO：走廊宽/走向/长度（对应申报书走廊场景）

  # --- M2 闭环 demo 默认值（对应 M2 验收清单：3–5 用户连跑 ≥10 时隙）---
  demo:
    n_users: 4
    n_slots: 12
    snr_db: 30.0
    window_half_width_modes: 2
    n_symbols: 4
